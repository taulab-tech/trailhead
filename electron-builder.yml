appId: com.trailhead.app
productName: Trailhead
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
win:
  # Installer, plus no-install options for locked-down machines: a single
  # portable .exe and a zip of the app folder.
  target:
    - nsis
    - portable
    - zip
  # Private Python + ddgs for the position lookup (see scripts/bundle-python.cjs).
  extraResources:
    - from: python-runtime/win
      to: python
mac:
  target: dmg
  category: public.app-category.education
linux:
  target: AppImage
  category: Education
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: Trailhead ${version} Portable.exe
