appId: com.trailhead.app
productName: Trailhead
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
win:
  target: nsis
  # Private Python + ddgs for the position lookup (see scripts/bundle-python.cjs).
  extraResources:
    - from: python-runtime/win
      to: python
mac:
  target: dmg
  category: public.app-category.education
linux:
  target: AppImage
  category: Education
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
