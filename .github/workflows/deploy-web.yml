name: Deploy web app

# Publishes the browser build to GitHub Pages: a folder of static files, with
# no server behind it. Nothing in this workflow handles student data — the
# database never leaves the machine of whoever is using the app.

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Electron and native-SQLite dependencies aren't needed to build the
      # web app, but `npm ci` installs the lockfile as a whole; skipping
      # Electron's own download keeps it quick.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build:web
        env:
          # A custom domain serves the app from the root; a default
          # github.io/<repo> URL serves it from a subfolder, and the built
          # asset paths have to match. Set the CUSTOM_DOMAIN repository
          # variable (Settings → Secrets and variables → Actions) when you
          # point a domain at this site.
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN && '/' || format('/{0}/', github.event.repository.name) }}

      - name: Add CNAME for the custom domain
        if: vars.CUSTOM_DOMAIN
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist-web/CNAME

      # GitHub Pages serves a 404 for unknown paths; pointing it at the app
      # means a deep link or a refresh still loads.
      - name: Add SPA fallback
        run: cp dist-web/index.html dist-web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
